# Fly.io configuration for 98138.world (feature 008). See docs/deploy.md.
# Not affiliated with or endorsed by The LEGO Group.
app = "world-98138"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  WEB98138_SITE_DIR = "/site"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop the machine when idle and start it on the next request (cheapest; the first request
  # after idle waits ~1-3 s). Set min_machines_running = 1 to avoid cold starts.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
