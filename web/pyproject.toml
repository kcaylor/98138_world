[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "web98138"
version = "0.1.0"
description = "The 98138.world web site: pick a map, preview it, download the build files (feature 008). Not affiliated with or endorsed by The LEGO Group."
authors = ["98138.world contributors"]
license = "MIT"
readme = "README.md"
packages = [{include = "web98138", from = "src"}]
include = [
    {path = "src/web98138/templates/*.html", format = ["sdist", "wheel"]},
    {path = "src/web98138/static/*", format = ["sdist", "wheel"]},
]

# Runtime: what the running service needs (all permissive: MIT / BSD-3).
# The build step (web98138.prebuild) also needs the CLI package `lego-image-processor`; it is
# installed from ../cli (see the dev group and the Dockerfile's build stage), not declared here,
# so the runtime image stays free of NumPy, SciPy, scikit-image and ReportLab.
[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115,<1"
jinja2 = "^3.1"
uvicorn = ">=0.30,<1"

[tool.poetry.group.dev.dependencies]
lego-image-processor = {path = "../cli", develop = true}
pytest = ">=7.4"
httpx2 = ">=2.16"
pypdf = ">=5"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
