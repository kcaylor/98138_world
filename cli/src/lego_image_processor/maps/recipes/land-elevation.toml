# Land elevation (ETOPO 2022 surface, ice-sheet tops over Greenland and Antarctica) on an ordered
# scale of 1x1 round plate colors, low greens through tans and browns to grey and white. Most of
# these plate colors are not in kit 31203; each is listed with cited LEGO, BrickLink and
# Rebrickable IDs in part_colors.json (`kit part-colors --part 6141`).
# The ocean is a quiet background so the land data stands out: Dark Turquoise (Bright Bluish Green)
# offshore, a Medium Azure ring along the coasts that fades evenly into it, and the land shadow
# (on by default) in Earth Blue just east of land.
# Not affiliated with or endorsed by The LEGO Group.
format = "1"
id = "land-elevation"
title = "Land elevation"
description = "Land elevation in metres on ten plate colors; the ocean is a calm blue background with a coastal halo and land shadow."
seed = 31203

[land]
role = "data"
dataset = "etopo2022-surface-10m"
variable = "z"
colors = [   # low -> high
  "lego_dark_green", "lego_bright_green", "lego_bright_yellowish_green", "lego_brick_yellow",
  "lego_sand_yellow", "lego_medium_nougat", "lego_reddish_brown", "lego_dark_brown",
  "lego_medium_stone_grey", "lego_white",
]

[land.classification]
method = "bins"
# metres; values below 0 go to the first class and above the last bound to the last class
bounds = [0, 150, 300, 500, 750, 1000, 1500, 2000, 2500, 3000, 9000]

[land.texture]
kind = "blend"
width = 0.25

[ocean]
role = "background"
colors = ["lego_bright_bluish_green", "lego_medium_azur"]   # offshore base, coast ring

[ocean.texture]
kind = "halo"
inner = 1.5     # studs from land: all Medium Azure
outer = 3.0     # studs from land: Medium Azure on an even Poisson-disk subset, fading out
spacing = 2.0   # minimum distance between those fade cells
# Map stickers (feature 017): sticker texts approved by the project owner, 2026-11-24
[sticker]
line = "Height of the land in metres, from lowland green through tan and brown to grey and ice-sheet white."
