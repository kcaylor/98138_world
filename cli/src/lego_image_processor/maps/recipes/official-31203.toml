# The official LEGO 31203 World Map design as a recipe (exact acceptance tier, FR-020).
# The ocean layer's data is the official design grid itself (a packaged categorical dataset),
# mapped one-to-one onto the kit's nine tile colors. No download is needed.
# Not affiliated with or endorsed by The LEGO Group.
format = "1"
id = "official-31203"
title = "Official 31203 World Map design"
description = "White land and the official ocean pattern, reproduced cell for cell from the design grid extracted from the kit's building instructions."
seed = 31203

# The official design already contains the land shadow (391 of its 392 Earth Blue tiles sit just
# east of land), and this recipe copies the design cell for cell, so the shadow is turned off here;
# drawing it again would overwrite one Brick Yellow cell and break the exact match.
[shadow]
enabled = false

[land]
role = "background"
colors = ["lego_white"]
weights = [1]

[ocean]
role = "data"
dataset = "kit31203-design"
variable = "color"
colors = [
  "lego_earth_blue", "lego_brick_yellow", "lego_flame_yellowish_orange", "lego_vibrant_coral",
  "lego_bright_orange", "lego_bright_yellowish_green", "lego_medium_azur", "lego_bright_green",
  "lego_bright_bluish_green",
]

[ocean.classification]
method = "categorical"

[ocean.classification.categories]
lego_earth_blue = "lego_earth_blue"
lego_brick_yellow = "lego_brick_yellow"
lego_flame_yellowish_orange = "lego_flame_yellowish_orange"
lego_vibrant_coral = "lego_vibrant_coral"
lego_bright_orange = "lego_bright_orange"
lego_bright_yellowish_green = "lego_bright_yellowish_green"
lego_medium_azur = "lego_medium_azur"
lego_bright_green = "lego_bright_green"
lego_bright_bluish_green = "lego_bright_bluish_green"
# Map stickers (feature 017): sticker texts approved by the project owner, 2026-11-24
[sticker]
title = "World Map, kit 31203 design"
line = "White land and the kit's ocean pattern in nine tile colors, cell for cell from its building instructions."
credit = "Design grid from the LEGO 31203 building instructions, extracted by 98138.world."
