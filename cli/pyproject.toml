[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "lego-image-processor"
version = "0.1.0"
description = "A CLI tool that converts images to LEGO-compatible color palettes using advanced color quantization algorithms"
authors = ["LEGO Image Processor Team"]
readme = "README.md"
packages = [{include = "lego_image_processor", from = "src"}]
# Bundled map recipes (feature 004) ship with the package next to the JSON reference data.
include = [{path = "src/lego_image_processor/maps/recipes/*.toml", format = ["sdist", "wheel"]}]

[tool.poetry.dependencies]
python = "^3.11"
Pillow = "^10.0.0"
numpy = "^1.24.0"
scikit-image = "^0.21.0"
click = "^8.1.0"
tqdm = "^4.65.0"
# Imported directly since feature 004 (netCDF-3 reader, nearest fill, texture noise); BSD-3-Clause.
scipy = "^1.11"
# Build sheets PDF (feature 006); BSD license, pure-Python wheel (needs Pillow, charset-normalizer).
reportlab = ">=4.4,<6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-benchmark = "^4.0.0"
pytest-cov = "^4.1.0"
# Reads build-sheet PDFs in tests (feature 006); BSD-3-Clause.
pypdf = ">=5"

# Maintainer-only tools (cli/tools/kit31203). Not needed to use the package:
#   poetry install --with maintainer
[tool.poetry.group.maintainer]
optional = true

[tool.poetry.group.maintainer.dependencies]
pypdf = ">=5"

[tool.poetry.scripts]
lego-image-processor = "lego_image_processor.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/lego_image_processor"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
